name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NOMAD_CONFIGURATION: Release
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/*.props
          **/*.targets

    - name: Restore
      shell: pwsh
      run: ./Build/Scripts/restore.ps1

    - name: Validate repo
      shell: pwsh
      run: ./Build/Scripts/validate-repo.ps1

    - name: Prepare artifacts directory
      shell: pwsh
      run: |
        if (Test-Path Artifacts) { Remove-Item Artifacts -Recurse -Force }
        New-Item -ItemType Directory -Path Artifacts | Out-Null

    - name: Build
      shell: pwsh
      run: ./Build/Scripts/build.ps1

    - name: Unit tests
      shell: pwsh
      run: ./Build/Scripts/test-unit.ps1

    - name: Generate release notes
      shell: pwsh
      run: ./Build/Scripts/generate-release-notes.ps1

    - name: Generate dependency graph
      shell: pwsh
      run: ./Build/Scripts/generate-dependency-graph.ps1

    - name: Generate compatibility matrix
      shell: pwsh
      run: ./Build/Scripts/generate-compatibility-matrix.ps1

    - name: Generate public API
      shell: pwsh
      run: ./Build/Scripts/generate-public-api.ps1

    - name: Generate architecture docs
      shell: pwsh
      run: ./Build/Scripts/generate-architecture-docs.ps1

    - name: Verify generated architecture docs are up to date
      run: git diff --exit-code Documentation/Architecture/Generated

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz zip

    - name: Generate Doxygen documentation
      run: doxygen Doxyfile

    - name: Add .nojekyll
      run: touch doxygen-output/html/.nojekyll

    - name: Archive Doxygen documentation
      run: |
        cd doxygen-output/html
        zip -r ../../Artifacts/NomadFramework.Docs.${{ github.ref_name }}.zip .

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: doxygen-output/html

    - name: Pack
      shell: pwsh
      run: ./Build/Scripts/pack.ps1

    - name: Upload NuGet artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-nuget-packages
        path: NuGet
        if-no-files-found: error

    - name: Upload release reports
      uses: actions/upload-artifact@v4
      with:
        name: release-reports
        path: Artifacts/**
        if-no-files-found: ignore

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          NuGet/*.nupkg
          NuGet/*.snupkg
          Artifacts/**
        body_path: Artifacts/ReleaseNotes.md
        generate_release_notes: true

    - name: Deploy documentation to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Publish to NuGet
      if: env.NUGET_API_KEY != ''
      shell: pwsh
      run: |
        $packages = Get-ChildItem -Path "NuGet" -Filter "*.nupkg"

        foreach ( $package in $packages ) {
          dotnet nuget push $package.FullName `
            --api-key "$env:NUGET_API_KEY" `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate
        }
