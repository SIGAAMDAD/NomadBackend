name: Pull Request

on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NOMAD_CONFIGURATION: Release

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/*.props
          **/*.targets

    - name: Restore
      shell: pwsh
      run: ./Build/Scripts/restore.ps1

    - name: Validate repo
      shell: pwsh
      run: ./Build/Scripts/validate-repo.ps1

    - name: Prepare artifacts directory
      shell: pwsh
      run: |
        if (Test-Path Artifacts) { Remove-Item Artifacts -Recurse -Force }
        New-Item -ItemType Directory -Path Artifacts | Out-Null

    - name: Generate compatibility matrix
      shell: pwsh
      run: ./Build/Scripts/generate-compatibility-matrix.ps1

    - name: Generate public API
      shell: pwsh
      run: ./Build/Scripts/generate-public-api.ps1

    - name: Build
      shell: pwsh
      run: ./Build/Scripts/build.ps1

    - name: Unit tests
      shell: pwsh
      run: ./Build/Scripts/test-unit.ps1

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Generate Doxygen documentation
      run: doxygen Doxyfile

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr-test-results
        path: Tests/TestResults
        if-no-files-found: ignore

    - name: Upload generated reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr-generated-reports
        path: Artifacts/**
        if-no-files-found: ignore
